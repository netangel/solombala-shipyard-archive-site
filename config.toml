# The URL the site will be built for
base_url = "https://archive.seapractic.ru"

# Default language for the site
default_language = "ru"

# Whether to automatically compile all Sass files in the sass directory
compile_sass = true

# Whether to build a search index to be used later on by a JavaScript library
build_search_index = true

# Minify HTML output
minify_html = true

# Generate feeds (RSS/Atom)
generate_feeds = false

taxonomies = [
    {name = "tags", feed = true}
]

[search]
# Use Fuse.js for better Russian language support
index_format = "fuse_json"

[extra]
# Put all your custom variables here
# ВРЕМЕННО: абсолютный адрес, пока медиа не лежат рядом с сайтом.
# Вернуть на "/media", когда файлы переедут.
media_url = "https://archive.seapractic.ru/media"

# Скомпилированный Sass (sass/style.scss → /style.css)
custom_css = "style.css"

# Инвентарная строка на главной: последняя ячейка — не счётчик, а факт
hull_range = "6–20 м"

# Ссылка на страницу поддержки. Раскомментировать, когда появится —
# без неё кнопка «Помочь архиву» на главной не выводится.
# support_url = "https://seapractic.ru/podderzhat-arhiv/"

# Чертёж недели: путь к листу от content/, например
# featured = "ShlyupkaRabochaya51-100/ShR_51_ShlyupkaRabochaya_3_5metra_Zakladka_1963.md"
# Пока не задан — главная сама берёт первый лист с эскизом.

# Ещё из избранного: 3–6 листов, выбор редактора. Пока не задан —
# главная показывает четыре следующих листа с эскизами.
# picks = ["Папка/лист.md"]

