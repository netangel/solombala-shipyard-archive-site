name: Build Dev Preview with Real Data

# Builds the site from the production metadata (Gitea) and publishes it to
# GitHub Pages. Images load from the public archive through extra.media_url.
#
# Publishes on pushes to main and claude/**, and on manual runs from those
# branches. Other branches are refused by the github-pages environment policy.
# Pull requests only validate the build.
#
# To preview unmerged metadata, start a manual run and set metadata_ref.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:
    inputs:
      metadata_ref:
        description: "Metadata branch to build from"
        required: true
        default: "main"

env:
  METADATA_REPO_URL: "https://git.dwal.in/solombala-archive/metadata.git"
  SCRIPTS_REPO: "netangel/archive-tovarishestvo"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-preview:
    # ubuntu-latest (26.04) has no powershell package yet.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Zola Templates (this repo)
        uses: actions/checkout@v4
        with:
          path: template

      - name: Clone JSON Metadata Repository
        env:
          METADATA_REF: ${{ inputs.metadata_ref || 'main' }}
        run: git clone --depth 1 --branch "$METADATA_REF" "$METADATA_REPO_URL" source

      - name: Checkout PowerShell Scripts
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SCRIPTS_REPO }}
          path: scripts

      - name: Install PowerShell
        run: |
          sudo apt-get update
          sudo apt-get install -y powershell

      - name: Install Zola
        run: |
          ZOLA_VERSION="$(tr -d '[:space:]' < template/.zola-version)"
          curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz
          sudo mv zola /usr/local/bin
          zola --version

      - name: Convert JSON to Zola Content
        shell: pwsh
        run: |
          . ./scripts/ConvertTo-ZolaContent.ps1 -MetadataPath ./source -ZolaContentPath ./template/content

      - name: Configure base URL for GitHub Pages
        run: |
          cd template
          sed -i 's|base_url = ".*"|base_url = "https://netangel.github.io/solombala-shipyard-archive-site"|' config.toml

      - name: Build Zola Site
        run: |
          cd template
          zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./template/public

  deploy-preview:
    # The github-pages environment's deployment branch policy only allows
    # `main` and `claude/*` - a PR's merge ref (refs/pull/N/merge) never
    # matches either, so it would always be rejected by environment
    # protection rules. Skip the deploy attempt for pull_request events;
    # build-preview above still validates the real-content build on PRs.
    if: github.event_name != 'pull_request'
    # All runs publish to one Pages site, so deploy them one at a time.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-preview
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
