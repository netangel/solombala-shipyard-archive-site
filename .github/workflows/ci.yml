name: CI

# Quick sanity check that content/template changes are still valid Zola.
# Uses the Zola version from .zola-version, the same one the preview and
# production builds use, so template syntax that doesn't parse under the
# pinned Tera version doesn't slip through.

on:
  pull_request:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: zola check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Zola version
        id: zola
        run: echo "version=$(tr -d '[:space:]' < .zola-version)" >> "$GITHUB_OUTPUT"

      - name: Setup Zola
        uses: taiki-e/install-action@v2
        with:
          tool: zola@${{ steps.zola.outputs.version }}

      - name: Validate config, templates and content (zola check)
        run: zola check --skip-external-links

      - name: Build site (zola build)
        run: zola build
